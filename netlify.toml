# 仅在「连接 Git 仓库自动构建」时生效；拖拽部署请依赖 public/_redirects 与 public/_headers
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 需要 Node 20.19+ / 22，这里固定 22
  NODE_VERSION = "22"
  # 下面三项是公开信息（项目 ID / 数据集名），写死在这里，
  # 这样即使 .env 没进仓库，线上构建也能正确拉到 Sanity 内容。
  # 如果以后换项目，改这里或在 Netlify 站点设置里覆盖即可。
  VITE_SANITY_PROJECT_ID = "rja1apyh"
  VITE_SANITY_DATASET = "production"
  VITE_SANITY_API_VERSION = "2025-01-01"

[[redirects]]
  from = "/studio"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/studio/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/media/cms/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
